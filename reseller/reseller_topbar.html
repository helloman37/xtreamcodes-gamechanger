      <script>
        (function(){
          function closeNav(){
            document.querySelectorAll('.xt-nav-dd.open').forEach(function(dd){ dd.classList.remove('open'); });
            document.querySelectorAll('.xt-nav-dd .xt-nav-btn[aria-expanded="true"]').forEach(function(btn){ btn.setAttribute('aria-expanded','false'); });
          }

          // nav dropdowns + active state
          document.addEventListener('click', function(e){
            var el = (e.target && e.target.nodeType === 1) ? e.target : (e.target && e.target.parentElement ? e.target.parentElement : null);
            if(!el){ return; }
            var dd = el.closest('.xt-nav-dd');
            var btn = el.closest('.xt-nav-btn');

            if(btn && dd){
              e.preventDefault();
              var isOpen = dd.classList.contains('open');
              closeNav();
              if(!isOpen){
                dd.classList.add('open');
                btn.setAttribute('aria-expanded','true');
              }
              return;
            }

            closeNav();
          });
          document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeNav(); });

          var path = (window.location.pathname || '').split('/').pop() || '';
          var links = document.querySelectorAll('.xt-nav [data-active]');
          links.forEach(function(a){
            var want = a.getAttribute('data-active');
            if(want === path){
              a.classList.add('active');
              var wrap = a.closest('.xt-nav-dd');
              if(wrap){
                var b = wrap.querySelector('button');
                if(b) b.classList.add('active');
              }
            }
          });

          // password modal
          var gear = document.getElementById('xtGear');
          var passOverlay = document.getElementById('xtPassOverlay');
          var passClose = document.getElementById('xtPassClose');
          var passCancel = document.getElementById('xtPassCancel');
          var passForm = document.getElementById('xtPassForm');
          var passMsg = document.getElementById('xtPassMsg');

          function openPass(){
            if(!passOverlay) return;
            passOverlay.classList.add('open');
            passOverlay.setAttribute('aria-hidden','false');
            if(passMsg) { passMsg.textContent=''; passMsg.classList.remove('ok','err'); }
            if(passForm) { passForm.reset(); }
            var first = passForm ? passForm.querySelector('input[name="current_password"]') : null;
            if(first) setTimeout(function(){ first.focus(); }, 0);
          }
          function closePass(){
            if(!passOverlay) return;
            passOverlay.classList.remove('open');
            passOverlay.setAttribute('aria-hidden','true');
          }

          if(gear){
            gear.addEventListener('click', function(ev){
              ev.preventDefault();
              closeNav();
              openPass();
            });
          }
          if(passClose){ passClose.addEventListener('click', function(){ closePass(); }); }
          if(passCancel){ passCancel.addEventListener('click', function(){ closePass(); }); }
          if(passOverlay){
            passOverlay.addEventListener('click', function(ev){ if(ev.target === passOverlay){ closePass(); } });
          }
          document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') closePass(); });

          if(passForm){
            passForm.addEventListener('submit', function(ev){
              ev.preventDefault();
              if(passMsg){ passMsg.textContent=''; passMsg.classList.remove('ok','err'); }
              var fd = new FormData(passForm);
              fd.append('ajax','1');
              fd.set('change_password','1');
              fetch('change_password.php', { method:'POST', body: fd, credentials:'same-origin' })
                .then(function(r){ return r.json(); })
                .then(function(data){
                  if(data && data.ok){
                    if(passMsg){ passMsg.textContent = data.message || 'Password updated.'; passMsg.classList.add('ok'); }
                    setTimeout(function(){ closePass(); }, 700);
                  } else {
                    if(passMsg){ passMsg.textContent = (data && (data.error||data.message)) ? (data.error||data.message) : 'Password update failed.'; passMsg.classList.add('err'); }
                  }
                })
                .catch(function(){
                  if(passMsg){ passMsg.textContent='Request failed.'; passMsg.classList.add('err'); }
                });
            });
          }
        })();
      </script>
